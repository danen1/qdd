<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>跳转页</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f7f8fa;
        color: #1f2328;
      }
      .hidden { display: none !important; }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .card {
        width: min(680px, 92vw);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 28px rgba(0,0,0,0.18);
        overflow: hidden;
      }
      .card__header {
        padding: 18px 20px;
        background: linear-gradient(90deg, #4b9cff 0%, #7c86ff 100%);
        color: #fff;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card__header svg { flex: 0 0 auto; }
      .card__body { padding: 16px 20px 20px; }
      .target {
        margin: 8px 0 14px;
        padding: 10px 12px;
        border: 1px dashed #c6d3ff;
        border-radius: 10px;
        background: #f3f6ff;
        word-break: break-all;
        font-size: 14px;
        color: #0b2a66;
        user-select: all;
      }
      .steps { display: grid; gap: 12px; }
      .step { display: flex; gap: 10px; align-items: flex-start; }
      .step .num {
        flex: 0 0 24px;
        height: 24px;
        border-radius: 50%;
        background: #e7efff;
        color: #2456c3;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        margin-top: 2px;
      }
      .actions { display: flex; gap: 10px; margin-top: 14px; }
      .btn {
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 14px;
      }
      .btn-primary { background: #2f6bff; color: #fff; }
      .btn-secondary { background: #eef3ff; color: #1f3e96; }
      .subtle { color: #6b7280; font-size: 13px; margin-top: 6px; }
      .hint-corner {
        position: absolute;
        right: 14px;
        top: 10px;
        color: #fff;
        font-size: 12px;
        opacity: 0.9;
        user-select: none;
      }

      @media (prefers-color-scheme: dark) {
        body { background: #0b0e12; color: #e5e7eb; }
        .overlay { background: rgba(0,0,0,0.55); }
        .card { background: #151922; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        .card__header { background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%); }
        .target { background: #101522; border-color: #2b3a70; color: #c7d2fe; }
        .btn-secondary { background: #1f2937; color: #c7d2fe; }
        .subtle { color: #9ca3af; }
        .step .num { background: #1f2937; color: #93c5fd; }
      }
    </style>
  </head>
  <body>
    <noscript>
      请开启 JavaScript 以完成跳转。目标地址：
      <a href="https://fb.qdd.ink">https://fb.qdd.ink</a>
    </noscript>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="title">
      <div class="card">
        <div class="card__header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2a1 1 0 0 1 1 1v7h7a1 1 0 1 1 0 2h-7v7a1 1 0 1 1-2 0v-7H4a1 1 0 1 1 0-2h7V3a1 1 0 0 1 1-1Z" fill="currentColor"/>
          </svg>
          <div id="title">请在浏览器中打开以继续</div>
          <div class="hint-corner" id="cornerHint">请点右上角菜单</div>
        </div>
        <div class="card__body">
          <div id="sceneDesc">已检测到在微信或QQ内打开，此页面受限。</div>
          <div class="target" id="targetUrl">https://fb.qdd.ink</div>

          <div class="steps" id="steps">
            <!-- 动态填充平台步骤 -->
          </div>

          <div class="actions">
            <button class="btn btn-primary" id="copyBtn" type="button">复制链接</button>
            <button class="btn btn-secondary" id="fallbackBtn" type="button">遇到问题？查看备用操作</button>
          </div>
          <div class="subtle" id="tips">无法复制？可长按上方链接手动复制</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var TARGET_URL = 'https://fb.qdd.ink';
        var ua = navigator.userAgent || '';
        var uaLow = ua.toLowerCase();

        // 场景识别（避免误伤第三方浏览器，如 MQQBrowser）
        var isWeChat = uaLow.indexOf('micromessenger') > -1; // 微信内置浏览器
        var isQQApp = / QQ\//.test(ua) || /qq\//i.test(uaLow); // QQ App 内置 WebView
        var isRestricted = isWeChat || isQQApp;

        // 平台识别
        var isIOS = /(iphone|ipad|ipod)/i.test(uaLow);
        var isAndroid = /android/i.test(uaLow);

        var overlay = document.getElementById('overlay');
        var stepsEl = document.getElementById('steps');
        var copyBtn = document.getElementById('copyBtn');
        var fallbackBtn = document.getElementById('fallbackBtn');
        var cornerHint = document.getElementById('cornerHint');
        var sceneDesc = document.getElementById('sceneDesc');
        var targetUrlEl = document.getElementById('targetUrl');

        targetUrlEl.textContent = TARGET_URL;

        function renderSteps() {
          var steps = [];
          if (isWeChat) {
            sceneDesc.textContent = '检测到您正在微信内打开，微信会限制直接打开外部浏览器。';
            if (isIOS) {
              cornerHint.textContent = '点击右上角 ··· 菜单';
              steps = [
                '点击右上角 ··· 菜单',
                '选择 “在 Safari 中打开”',
                '在 Safari 中将自动跳转到目标链接'
              ];
            } else {
              cornerHint.textContent = '点击右上角菜单';
              steps = [
                '点击右上角菜单按钮',
                '选择 “在浏览器中打开” 或 “使用默认浏览器打开”',
                '将在外部浏览器自动跳转到目标链接'
              ];
            }
          } else if (isQQApp) {
            sceneDesc.textContent = '检测到您正在QQ内打开，QQ会限制直接打开外部浏览器。';
            if (isIOS) {
              cornerHint.textContent = '点击右上角 ··· 菜单';
              steps = [
                '点击右上角 ··· 菜单',
                '选择 “在 Safari 中打开”',
                '在 Safari 中将自动跳转到目标链接'
              ];
            } else {
              cornerHint.textContent = '点击右上角菜单';
              steps = [
                '点击右上角菜单按钮',
                '选择 “在浏览器中打开” 或 “使用默认浏览器打开”',
                '将在外部浏览器自动跳转到目标链接'
              ];
            }
          }

          stepsEl.innerHTML = '';
          steps.forEach(function (text, i) {
            var item = document.createElement('div');
            item.className = 'step';
            item.innerHTML = '<div class="num">' + (i+1) + '</div><div class="text">' + text + '</div>';
            stepsEl.appendChild(item);
          });
        }

        function showOverlay() {
          overlay.classList.remove('hidden');
          renderSteps();
        }

        function tryCopy(text) {
          // 优先使用现代 API（在 https / localhost 等安全上下文可用）
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              toast('链接已复制，请到外部浏览器粘贴打开');
            }).catch(function () {
              legacyCopy(text);
            });
          } else {
            legacyCopy(text);
          }
        }

        function legacyCopy(text) {
          var input = document.createElement('input');
          input.value = text;
          document.body.appendChild(input);
          input.select();
          try { document.execCommand('copy'); toast('链接已复制'); }
          catch (e) { toast('复制失败，请长按上方链接手动复制'); }
          document.body.removeChild(input);
        }

        function toast(msg) {
          var tip = document.createElement('div');
          tip.textContent = msg;
          tip.style.position = 'fixed';
          tip.style.left = '50%';
          tip.style.top = '20%';
          tip.style.transform = 'translate(-50%, -50%)';
          tip.style.background = 'rgba(0,0,0,0.8)';
          tip.style.color = '#fff';
          tip.style.padding = '8px 12px';
          tip.style.borderRadius = '8px';
          tip.style.zIndex = '10000';
          document.body.appendChild(tip);
          setTimeout(function () { document.body.removeChild(tip); }, 1500);
        }

        copyBtn.addEventListener('click', function () { tryCopy(TARGET_URL); });
        fallbackBtn.addEventListener('click', function () {
          var msg = isIOS
            ? '如果看到“不能打开页面”或没有外部浏览器选项：\n\n1）复制上方链接\n2）回到主屏，打开 Safari\n3）粘贴并访问\n'
            : '如果没有“在浏览器中打开”选项或打不开：\n\n1）复制上方链接\n2）返回桌面，打开手机默认浏览器（Chrome/系统浏览器）\n3）粘贴并访问\n';
          alert(msg);
        });

        // 主逻辑：在受限场景提示；否则立即跳转
        if (isRestricted) {
          showOverlay();
        } else {
          // 使用 replace 避免在历史栈中保留当前页
          try { window.location.replace(TARGET_URL); }
          catch (e) { window.location.href = TARGET_URL; }
        }
      })();
    </script>
  </body>
</html>
