<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跳转页后台配置</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; margin: 0; padding: 24px; background: #0b0f1a; color: #fff; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .card { background: #121826; border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.06); }
    label { display: block; font-size: 13px; margin: 12px 0 6px; color: #cfd7e6; }
    input[type="text"], textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #0e1320; color: #fff; outline: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .btns { display: flex; gap: 10px; margin-top: 16px; }
    button { padding: 10px 14px; border-radius: 999px; border: none; color: white; cursor: pointer; font-weight: 700; letter-spacing: .2px; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
    .primary { background: linear-gradient(135deg, #6a7cff 0%, #9f73ff 50%, #ff74d1 100%); }
    .secondary { background: #1f2937; }
    .status { margin-top: 8px; font-size: 12px; color: #a3b2cc; min-height: 16px; }
    .footer { margin-top: 18px; font-size: 12px; color: #a3b2cc; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>跳转页后台配置</h1>
    <div class="card">
      <label for="target_url">跳转目标域名（完整 URL）</label>
      <input id="target_url" type="text" placeholder="例如 https://fb.qdd.ink" />

      <div class="row">
        <div>
          <label for="contact">签名/联系链接</label>
          <input id="contact" type="text" placeholder="例如 https://t.me/epay413" />
        </div>
        <div>
          <label for="copyright">版权文案</label>
          <input id="copyright" type="text" placeholder="例如 © 2025 qdd.ink · 保留所有权利" />
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="saveBtn">保存配置</button>
        <button class="secondary" id="reloadBtn">重新加载</button>
        <button class="secondary" id="logoutBtn">退出登录</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="footer">本页面仅用于配置跳转页，不对外公开。</div>
  </div>

  <script>
    const els = {
      target_url: document.getElementById('target_url'),
      contact: document.getElementById('contact'),
      copyright: document.getElementById('copyright'),
      status: document.getElementById('status'),
      saveBtn: document.getElementById('saveBtn'),
      reloadBtn: document.getElementById('reloadBtn'),
      logoutBtn: document.getElementById('logoutBtn')
    };

    async function load() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        els.target_url.value = data.target_url || '';
        els.contact.value = data.contact || '';
        els.copyright.value = data.copyright || '';
        els.status.textContent = '已加载当前配置';
      } catch (e) {
        els.status.textContent = '加载失败，请检查后台服务';
      }
    }

    async function save() {
      const payload = {
        target_url: els.target_url.value.trim(),
        contact: els.contact.value.trim(),
        copyright: els.copyright.value.trim()
      };
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.status === 401) {
          els.status.textContent = '未登录或登录过期，正在跳转到登录页…';
          setTimeout(() => { window.location.href = '/login'; }, 600);
          return;
        }
        const data = await res.json();
        els.status.textContent = '已保存：' + (data.target_url || '');
      } catch (e) {
        els.status.textContent = '保存失败，请稍后重试';
      }
    }

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST' });
      } catch (e) {}
      window.location.href = '/login';
    }

    els.saveBtn.addEventListener('click', save);
    els.reloadBtn.addEventListener('click', load);
    els.logoutBtn.addEventListener('click', logout);
    load();
  </script>
</body>
</html>
